# EDO PKI Monitor: collector for the template "EDO PKI Monitor by Zabbix agent active".
# itforprof.com by Konstantin Tyutyunnik — https://github.com/IT-for-Prof/zabbix-edo-pki-monitor
#
# Install (details: README, "Установка"):
#   1. edo-pki.ps1 -> C:\Program Files\Zabbix Agent 2\scripts\edo-pki.ps1
#      (write access to the scripts folder only for Administrators and SYSTEM: the script runs as LocalSystem).
#   2. This file -> C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\edo-pki-monitor.conf
#   3. Restart-Service 'Zabbix Agent 2'. Not "zabbix_agent2 -R userparameter_reload": agent 7.0.12 crashed on it
#      while a check of a reloaded parameter was running (measured 16.09.2026).
#   4. Link the template to the host together with "Windows by Zabbix agent active".
#
# Parameters come from the template macros: network, local, stores, containers, CRL addresses, TSP services.
# UnsafeUserParameters stays off. The item timeout is set by the template ({$PKI.TIMEOUT}); the pass itself
# stops at 90 s.

UserParameter=edo.pki[*],powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\edo-pki.ps1" "$1" "$2" "$3" "$4" "$5" "$6" "$7"
