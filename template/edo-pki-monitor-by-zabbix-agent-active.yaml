zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 083a756bf2ca43a2928f1fa1fbae3eda
      name: Templates/Custom
  templates:
    - uuid: 321f12be1a864bcb94ea4b2b48392630
      template: 'EDO PKI Monitor by Zabbix agent active'
      name: 'EDO PKI Monitor by Zabbix agent active'
      description: |
        Инфраструктура подписи для ЭДО с самого хоста: списки отзыва по сети и в машинном хранилище CA, OCSP, сертификаты УЦ по AIA, службы штампов времени и часы хоста. Адреса CRL, OCSP и УЦ выводятся из действующих сертификатов хоста (хранилища {$PKI.STORES} и контейнеры КриптоПро), службы штампов — макрос {$PKI.TSP.URLS}.

        Один проход сборщика edo-pki.ps1 раз в {$PKI.INTERVAL} отдаёт JSON; правила обнаружения заводят объекты по адресам, сертификатам, УЦ и службам. Сетевые проверки выключаются {$PKI.NETWORK} = 0, локальные списки — {$PKI.LOCAL} = 0.

        Требования: Zabbix agent 2 7.0 (не новее сервера 7.0); edo-pki.ps1 и edo-pki-monitor.conf на хосте; «Windows by Zabbix agent active» на том же хосте; КриптоПро CSP — для контейнеров; исходящий HTTP (порт 80) к узлам УЦ для powershell.exe.

        Author:  Konstantin Tyutyunnik / Константин Тютюнник
        Site:    https://itforprof.com
        Repo:    https://github.com/IT-for-Prof/zabbix-edo-pki-monitor
      vendor:
        name: itforprof.com
        version: 1.2.0
      groups:
        - name: Templates/Custom
      items:
        - uuid: 1334d3b3b4ef47aabb063e97e1f3ca9b
          name: 'EDO PKI: результат сборщика'
          type: ZABBIX_ACTIVE
          key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          delay: '{$PKI.INTERVAL}'
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: '{$PKI.TIMEOUT}'
          description: 'JSON одного прохода edo-pki.ps1. Мастер всех правил обнаружения и элементов: длительность прохода меняется каждый раз, поэтому зависимые правила обнаружения обрабатываются при каждом значении.'
          tags:
            - tag: component
              value: collector
        - uuid: ef9eca5722a4496cb456ba0df66e9f68
          name: 'EDO PKI: длительность прохода'
          type: DEPENDENT
          key: edo.pki.ms
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: ms
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ms
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: collector
        - uuid: 1a1e5cc8b85e4a3ea8e8d6d5c8c2ed28
          name: 'EDO PKI: ошибка сборщика'
          type: DEPENDENT
          key: edo.pki.error
          delay: '0'
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Пусто — проход выполнен. Иначе сборщик не отдал списков: неверный аргумент, слишком большой результат или внутренний сбой. Необязательные поля и хвост списков сокращаются с отметкой truncated=1.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
              error_handler_params: 'result is not JSON'
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: 84cfb972c21340949eb697d77ece6c57
              expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              name: 'EDO PKI: сборщик не работает'
              event_name: 'EDO PKI: сборщик не работает на {HOST.NAME}'
              opdata: 'Ошибка: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: |
                Нет результата сборщика дольше {$PKI.NODATA} или сборщик сообщает ошибку. Проблемы по адресам, сертификатам и службам на это время не поднимаются: они зависят от этого триггера.

                Что делать:
                - нет данных — элемент «результат сборщика» не поддерживается: нет edo-pki.ps1 или edo-pki-monitor.conf, служба агента не перезапущена, превышен {$PKI.TIMEOUT};
                - «invalid argument» — неверное значение макроса {$PKI.*} на хосте или шаблоне (адреса только http:// из A-Z a-z 0-9 . _ / -);
                - «output too large» — не удалось уложить результат в 55 000 символов после сокращения: сократить {$PKI.STORES} или выключить лишний источник;
                - «collector failed» — текст ошибки в истории элемента «ошибка сборщика».
              manual_close: 'YES'
              dependencies:
                - name: 'Windows: Active checks are not available'
                  expression: 'min(/Windows by Zabbix agent active/zabbix[host,active_agent,available],{$AGENT.TIMEOUT})=2'
                - name: 'Windows: Zabbix agent is not available'
                  expression: 'nodata(/Windows by Zabbix agent active/agent.ping,{$AGENT.NODATA_TIMEOUT})=1'
              tags:
                - tag: scope
                  value: data-collection
        - uuid: 19c6be1b320c4bb19e4bbc0b8f3a4980
          name: 'EDO PKI: неполнота обнаружения'
          type: DEPENDENT
          key: edo.pki.incomplete
          delay: '0'
          history: 30d
          description: 'Число источников, контейнеров и адресов, которые не удалось прочитать или которые отвергнуты проверкой символов. Больше 0 — список адресов может быть неполным.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.incomplete
              error_handler: DISCARD_VALUE
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: discovery
          triggers:
            - uuid: 47934b9d1acc40c5ae69c50d51c3a84a
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.incomplete)>0 and (last(/EDO PKI Monitor by Zabbix agent active/edo.pki.diagnostic)<>"" or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.diagnostic)="")'
              name: 'EDO PKI: обнаружение неполное'
              event_name: 'EDO PKI: на {HOST.NAME} обнаружены не все сертификаты или адреса ({ITEM.LASTVALUE1})'
              opdata: 'Не прочитано: {ITEM.LASTVALUE1}; Диагностика: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: |
                Источник сертификатов недоступен, контейнер КриптоПро не отдал сертификат (сертификат взят из кэша, если он там был) или адрес в сертификате отвергнут проверкой символов. Неполнота не должна молча уменьшать список проверок.

                Что делать: поле sources в истории «результат сборщика» показывает источник со state 1; на хосте от администратора — csptest -keyset -enum_cont -fqcn -verifycontext и извлечение сертификата из контейнера; проверить носитель и права SYSTEM на контейнеры.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: discovery
        - uuid: 65479d6ef8464191b6e76f701e50e83e
          name: 'EDO PKI: объектов инфраструктуры подписи'
          type: DEPENDENT
          key: edo.pki.objects
          delay: '0'
          history: 30d
          description: 'Сколько адресов CRL, адресов AIA, ответчиков OCSP и локальных списков нашлось на хосте. Ноль означает, что про подпись на этом хосте не проверяется ничего.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.objects
              error_handler: DISCARD_VALUE
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: discovery
          triggers:
            - uuid: 6bc3adf249064922abe3834b78878858
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.objects)=0 and last(/EDO PKI Monitor by Zabbix agent active/edo.pki.incomplete)=0 and {$PKI.APPLICABLE}<>0'
              name: 'EDO PKI: на хосте нечего проверять'
              event_name: 'EDO PKI: на {HOST.NAME} не найдено ни одного сертификата и не объявлено ни одного адреса'
              opdata: 'Объектов: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                Сборщик отработал, но на хосте нет ни действующих сертификатов в источниках, ни адресов в {$PKI.CRL.URLS}: списки отзыва, OCSP и сертификаты УЦ не проверяются, и зелёный хост об исправности подписи ничего не говорит. Проблема не поднимается, когда источник не прочитан: это отдельная проблема «обнаружение неполное».

                Что делать: убедиться, что на хосте вообще подписывают. Если подписывают, а сертификаты лежат в профилях пользователей (терминальный сервер, токен в сеансе), объявить УЦ адресами их списков отзыва в {$PKI.CRL.URLS} — по ним заработают и сетевые проверки, и проверка локальных списков. Если не подписывают, отвязать шаблон.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: discovery
            - uuid: 8c4b2a6d1e7f4a5b9c0d2e3f4a5b6c71
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.objects)>=0 and {$PKI.APPLICABLE}=0'
              name: 'EDO PKI: мониторинг подписи явно не применим'
              event_name: 'EDO PKI: {HOST.NAME} явно исключён из мониторинга подписи'
              opdata: 'Диагностика: MONITORING_NOT_APPLICABLE; действие: отвязать шаблон'
              priority: INFO
              description: |
                На хосте макрос {$PKI.APPLICABLE}=0. Сборщик не поднимает сетевые и локальные проблемы подписи, потому что мониторинг явно отключён.

                Что делать: если на хосте нужна подпись ЭДО, вернуть {$PKI.APPLICABLE}=1. Если не нужна — отвязать шаблон.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: discovery
        - uuid: 7a5fdb07ed0a4d35a6a06e6d5cb3d8f1
          name: 'EDO PKI: краткая диагностика'
          type: DEPENDENT
          key: edo.pki.diagnostic
          delay: '0'
          history: 30d
          value_type: CHAR
          trends: '0'
          description: 'Краткая allowlist-диагностика причины и следующего действия из последнего прохода сборщика.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.diagnostic
              error_handler: DISCARD_VALUE
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: collector
        - uuid: c460cd35e44546db96a0fc9d2c49c166
          name: 'EDO PKI: сертификаты УЦ в хранилищах подписи'
          type: DEPENDENT
          key: edo.pki.ca_certs
          delay: '0'
          history: 30d
          value_type: TEXT
          trends: '0'
          description: 'Сертификаты удостоверяющих центров, найденные в хранилищах {$PKI.STORES}: хранилище, УЦ, отпечаток и срок. Их цепочки не проверяются: сертификат УЦ не является сертификатом подписи хоста.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ca_certs
              error_handler: DISCARD_VALUE
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: discovery
          triggers:
            - uuid: d2940e49768b490f914e4fc528ca34ad
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.ca_certs)<>""'
              name: 'EDO PKI: сертификат УЦ лежит в хранилище подписи'
              event_name: 'EDO PKI: на {HOST.NAME} в хранилище подписи лежит сертификат УЦ'
              opdata: '{ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                В машинном хранилище из {$PKI.STORES} лежит сертификат удостоверяющего центра. Хранилище подписи предназначено для сертификатов самого хоста, и посторонний сертификат УЦ затягивает в мониторинг чужой УЦ вместе с требованием его локального списка.

                Что делать: посмотреть поле ca_certs в истории «результат сборщика» — там хранилище, имя УЦ, отпечаток и срок. Подчинённый УЦ перенести в «Промежуточные центры сертификации», корневой — в «Доверенные корневые», из «Личного» удалить. Построению цепочек это не мешает: сертификат из хранилища используется и после переноса. Подпись от такого сертификата не ломается, но мониторинг и проверка отзыва тянут лишний УЦ, а сертификат, положенный не туда, часто признак ручной установки мимо принятого порядка — поэтому проблема приходит сообщением.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: discovery
        - uuid: 55f1673b4c5a4b3aa00da1053fa26bbb
          name: 'EDO PKI: проход не уложился в срок'
          type: DEPENDENT
          key: edo.pki.deadline
          delay: '0'
          history: 30d
          description: '1 — срок прохода 90 с вышел, часть объектов не проверена (состояние 90).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.deadline
              error_handler: DISCARD_VALUE
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: 7c8341cc15834a2391401478967cf4d0
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.deadline)=1'
              name: 'EDO PKI: проход не уложился в срок'
              event_name: 'EDO PKI: проход на {HOST.NAME} не уложился в 90 с'
              opdata: 'Длительность: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                Сетевые проверки не закончились за 90 с: объекты, до которых проход не дошёл, получили состояние 90 и проблем по себе не поднимают.

                Что делать: в истории «результат сборщика» найти адреса с большим ms и состояниями 20 (таймаут); обычно это один недоступный узел УЦ с несколькими адресами. Если узел мёртв постоянно — исключить его адреса {$PKI.ALERT:regex:"..."} = 0 не поможет времени прохода: убрать службу из {$PKI.TSP.URLS} или адрес из {$PKI.CRL.URLS}.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: data-collection
        - uuid: 9da64234d2994b01abbb0f78c7588322
          name: 'EDO PKI: расхождение часов хоста'
          type: DEPENDENT
          key: edo.pki.clock_skew
          delay: '0'
          history: 30d
          value_type: FLOAT
          units: s
          description: 'Наименьшее по модулю расхождение часов хоста со временем штампов служб, выдавших штамп. Нет ни одного выданного штампа — значение не приходит; проблема расхождения закрывается, когда значения нет дольше {$PKI.NODATA}.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.clock_skew_s
              error_handler: DISCARD_VALUE
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          tags:
            - tag: component
              value: clock
          triggers:
            - uuid: 143552ba353249d99f321beaf39ba07d
              expression: 'abs(last(/EDO PKI Monitor by Zabbix agent active/edo.pki.clock_skew))>{$PKI.CLOCK.MAX} and nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.clock_skew,{$PKI.NODATA})=0'
              name: 'EDO PKI: часы хоста расходятся со службами штампов'
              event_name: 'EDO PKI: часы {HOST.NAME} расходятся со службами штампов на {ITEM.LASTVALUE1}'
              opdata: 'Расхождение: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                Все службы штампов, выдавшие штамп, расходятся с часами хоста больше чем на {$PKI.CLOCK.MAX} с. Одна служба с неверными часами проблему не поднимает: берётся наименьшее расхождение. В норме 0,1–1,0 с при разрешении времени штампа 1 с.

                Что делать: w32tm /query /status на хосте — источник и время последней синхронизации; w32tm /resync; проверить доступность NTP-источника.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: clock
        - uuid: 4f63ce0116744f8ebed5273b6770623a
          name: 'EDO PKI: MD5 скрипта сборщика'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.md5sum["C:\Program Files\Zabbix Agent 2\scripts\edo-pki.ps1"]'
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Хеш раскатанного edo-pki.ps1. Установка ручная (скрипт копируется на каждый хост), поэтому отстающие хосты видны сравнением с {$PKI.SCRIPT.MD5} без запуска PowerShell.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: 8873b31e1603485abbea382857ef95fb
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/vfs.file.md5sum["C:\Program Files\Zabbix Agent 2\scripts\edo-pki.ps1"])<>"{$PKI.SCRIPT.MD5}"'
              name: 'EDO PKI: версия скрипта сборщика не совпадает'
              event_name: 'EDO PKI: на {HOST.NAME} не та версия edo-pki.ps1'
              opdata: 'MD5: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
                MD5 файла edo-pki.ps1 на хосте отличается от {$PKI.SCRIPT.MD5}: на хосте старый или изменённый вручную сборщик.

                Что делать: раскатать edo-pki.ps1 из репозитория (README, «Установка»). Если скрипт обновлён намеренно — записать его MD5 в {$PKI.SCRIPT.MD5} на шаблоне.
              manual_close: 'YES'
              dependencies:
