      tags:
        - tag: class
          value: service
        - tag: target
          value: edo-pki
        - tag: vendor
          value: itforprof
      macros:
        - macro: '{$PKI.ALERT}'
          value: '1'
          description: 'Проблемы по адресу включены (1) или выключены (0). Исключение адреса — контекст regex по адресу на шаблоне: {$PKI.ALERT:regex:"^http://имя/"} = 0. Значения при этом собираются.'
        - macro: '{$PKI.ALERT:regex:"^http://c0000-app005/"}'
          value: '0'
          description: 'Внутреннее имя ФНС c0000-app005 из CDP и AIA сертификатов ФНС не разрешается в DNS вне сети ФНС (замер 16.09.2026).'
        - macro: '{$PKI.ALERT:regex:"^http://ca.vtb.ru/nuc/ocsp.srf$"}'
          value: '0'
          description: 'Ответчик OCSP УЦ «НУЦ Банк ВТБ (ПАО)» (самоподписанный корень вне ГУЦ Минцифры) отвечает HTTP 500 на любой запрос с обоих адресов и с двух разных маршрутов (замеры 16–17.09.2026). Отзыв таких сертификатов проверяется по CRL ВТБ, который работает. Убрать макрос, когда ВТБ починит ответчик: состояние адреса собирается.'
        - macro: '{$PKI.CLOCK.MAX}'
          value: '10'
          description: 'Порог Average «часы хоста расходятся», секунд. Норма 0,1–1,0 с при разрешении времени штампа 1 с.'
        - macro: '{$PKI.CONTAINERS}'
          value: '1'
          description: 'Источник «контейнеры КриптоПро, видимые LocalSystem» (1) или выключен (0). Нужен csptest КриптоПро CSP.'
        - macro: '{$PKI.APPLICABLE}'
          value: '1'
          description: 'Хост участвует в мониторинге подписи (1) или явно не применим (0). При 0 событие объясняет, что шаблон нужно отвязать; пустой результат не считается не применимым.'
        - macro: '{$PKI.CRL.URLS}'
          description: 'Явный список адресов CRL через запятую, не привязанных к сертификатам хоста: http:// из A-Z a-z 0-9 . _ / -. Издатель списка попадает в локальную проверку.'
        - macro: '{$PKI.FAIL.PERIOD}'
          value: '#2'
          description: 'Период для проблем адресов и служб в формате Zabbix: #2 — две проверки подряд. Целиком макрос, а не #{$MACRO}: Zabbix 7.0 не принимает макрос внутри счётчика функции.'
        - macro: '{$PKI.INTERVAL}'
          value: 15m
          description: 'Интервал прохода сборщика.'
        - macro: '{$PKI.LOCAL}'
          value: '1'
          description: 'Проверка локальных списков в машинном хранилище CA (1) или выключена (0). Выключать на хостах, где списки в CA не устанавливаются: Windows сама их туда не кладёт.'
        - macro: '{$PKI.LOCAL.WARN.PCT}'
          value: '50'
          description: 'Порог Warning «локальный список истекает»: процент периода списка, который ещё остался.'
        - macro: '{$PKI.NETWORK}'
          value: '1'
          description: 'Сетевые проверки (CRL, AIA, OCSP, штампы) включены (1) или выключены (0). Выключенные проверки убирают объекты из обнаружения и не создают проблем; локальные списки проверяются.'
        - macro: '{$PKI.NODATA}'
          value: 50m
          description: 'Окно без результата сборщика для Average «сборщик не работает». Больше двух {$PKI.INTERVAL} и больше {$AGENT.NODATA_TIMEOUT} (30m): при смерти агента первым поднимается его триггер.'
        - macro: '{$PKI.SCRIPT.MD5}'
          value: '486b4f508ee0cf4e61a6ef1ca0053da9'
          description: 'MD5 текущей версии agent/edo-pki.ps1 (с BOM и CRLF, как после checkout). Меняется вместе со скриптом; расхождение на хосте — Average.'
        - macro: '{$PKI.STORES}'
          value: My
          description: 'Машинные хранилища Windows через запятую (A-Z a-z 0-9 и пробел). Пусто — источник выключен. My по умолчанию: CA и Root добавили бы сотни сертификатов чужой публичной PKI.'
        - macro: '{$PKI.TIMEOUT}'
          value: 120s
          description: 'Таймаут элемента «результат сборщика». Проход сам останавливается на 90 с; запуск powershell.exe через агента — 3,8–4,3 с (замер 16.09.2026).'
        - macro: '{$PKI.TSP.KEY.DAYS}'
          value: '30'
          description: 'Порог Warning «ключ подписи службы штампов истекает», дней.'
        - macro: '{$PKI.TSP.URLS}'
          value: 'http://tsp2012.taxcom.ru/tsp/tsp.srf,http://pki.skbkontur.ru/tsp2012/tsp.srf,http://pki.tax.gov.ru/tsp/tsp.srf'
          description: 'Службы штампов через запятую. По умолчанию — адреса из официальных источников Такскома, Контура и УЦ ФНС, выдававшие штамп на ГОСТ 16.09.2026. Пусто — проверка штампов и часов выключена.'
