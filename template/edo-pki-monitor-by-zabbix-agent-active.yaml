              name: 'EDO PKI CRL {#CA}: узел недоступен {#URL}'
              event_name: 'EDO PKI: список отзыва {#CA} по {#URL} с {HOST.NAME}: узел недоступен ({ITEM.LASTVALUE1})'
              opdata: 'Состояние: {ITEM.LASTVALUE1}; Причина: {ITEM.LASTVALUE2}'
              priority: AVERAGE
              description: |
                Все проверки за {$PKI.FAIL.PERIOD} закончились сетевым отказом: узел по адресу не отвечает с этого хоста. Пока локальная копия в хранилище CA действует, подпись работает; массовость видна по числу хостов.

                Что делать по состоянию:
                - 10 DNS_FAIL — имя не разрешается: внутреннее имя УЦ (c0000-app005 у ФНС) — исключить адрес {$PKI.ALERT:regex:"^http://имя/"} = 0 на шаблоне; иначе DNS хоста;
                - 20 TIMEOUT, 22 REFUSED, 24 NETWORK_FAIL — узел не отвечает; сравнить с другими хостами;
                - 23 FIREWALL_DENIED — локальный фаервол не пускает powershell.exe к узлу: добавить адрес узла в правила исходящего фаервола.

                Смена вида отказа (сеть, ответ сервера, содержимое, служба) закрывает эту проблему и открывает проблему нового вида; смена кода внутри вида проблему не меняет — текущий код в операционных данных, в имени события остаётся код на момент открытия.
