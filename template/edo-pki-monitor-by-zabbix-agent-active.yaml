        - uuid: 493da2efd83f4a6a908f574129f47dd6
          name: 'EDO PKI: сертификаты хоста'
          type: DEPENDENT
          key: edo.pki.cert.discovery
          delay: '0'
          lifetime_type: DELETE_AFTER
          lifetime: 7d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'Действующие сертификаты с адресом OCSP. Сертификат обозначен первыми 8 символами SHA-256 от отпечатка, издателем и датой окончания — без данных владельца. Истёкший сертификат пропадает из обнаружения.'
          item_prototypes:
            - uuid: ce79524ca3534e6eb7ce156333f26d16
              name: 'EDO PKI сертификат {#CERT.ID} ({#CERT.CA}, до {#CERT.NOTAFTER}): статус OCSP'
              type: DEPENDENT
              key: 'edo.pki.cert.status["{#CERT.ID}"]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              description: '0 — действует, 1 — отозван, 2 — ответчик не знает сертификат, -1 — не проверен (ответчик не ответил, издателя нет в цепочке или сеть выключена).'
              valuemap:
                name: 'EDO PKI certificate status'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.certs[?(@.id==''{#CERT.ID}'')].status.first()'
                  error_handler: DISCARD_VALUE
              master_item:
                key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
              tags:
                - tag: component
                  value: certificate
                - tag: ca
                  value: '{#CERT.CA}'
                - tag: certificate
                  value: '{#CERT.ID}'
          trigger_prototypes:
            - uuid: e9a6d112e46c47bebe03be9c812d7224
              expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"])=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"])=0 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"])=2'
              name: 'EDO PKI сертификат {#CERT.ID} ({#CERT.CA}, до {#CERT.NOTAFTER}): отозван'
              event_name: 'EDO PKI: на {HOST.NAME} отозван сертификат {#CERT.ID} ({#CERT.CA}, до {#CERT.NOTAFTER})'
              opdata: 'Статус: {ITEM.LASTVALUE1}'
              priority: HIGH
              description: |
                Ответчик OCSP сообщил, что сертификат отозван. Подпись этим сертификатом не пройдёт проверку.

                Что делать: найти сертификат на хосте по издателю и дате окончания (идентификатор — первые 8 символов SHA-256 от отпечатка), выяснить у владельца причину отзыва, выпустить новый и убрать отозванный из контейнера.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: revocation
            - uuid: 85a0e060775a474f9ebda7bad2d34837
              expression: 'min(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"],{$PKI.FAIL.PERIOD})=2 and max(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"],{$PKI.FAIL.PERIOD})=2'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"])=0 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.cert.status["{#CERT.ID}"])=1'
              name: 'EDO PKI сертификат {#CERT.ID} ({#CERT.CA}, до {#CERT.NOTAFTER}): статус неизвестен'
              event_name: 'EDO PKI: ответчик OCSP не знает сертификат {#CERT.ID} ({#CERT.CA}) на {HOST.NAME}'
              opdata: 'Статус: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: |
