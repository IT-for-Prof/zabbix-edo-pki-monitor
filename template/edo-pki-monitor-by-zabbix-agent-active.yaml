                Что делать: убедиться, что сертификат выпущен этим УЦ (издатель {#CERT.CA}) и адрес OCSP в нём верный; обратиться в УЦ.
              manual_close: 'YES'
              dependencies:
                - name: 'EDO PKI: сборщик не работает'
                  expression: 'nodata(/EDO PKI Monitor by Zabbix agent active/edo.pki.ms,{$PKI.NODATA})=1 or last(/EDO PKI Monitor by Zabbix agent active/edo.pki.error)<>""'
              tags:
                - tag: scope
                  value: revocation
          master_item:
            key: 'edo.pki["{$PKI.NETWORK}","{$PKI.LOCAL}","{$PKI.STORES}","{$PKI.CONTAINERS}","{$PKI.CRL.URLS}","{$PKI.TSP.URLS}","{$PKI.APPLICABLE}"]'
          lld_macro_paths:
            - lld_macro: '{#CERT.CA}'
              path: $.ca
            - lld_macro: '{#CERT.ID}'
              path: $.id
            - lld_macro: '{#CERT.NOTAFTER}'
              path: $.not_after
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.certs
